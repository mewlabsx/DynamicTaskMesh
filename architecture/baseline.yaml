  basis: "Gate B Phase 1 Closure Record, the accepted Gate B Phase 2 design and Design Acceptance record, the bounded implementation and bounded-fix records, the fresh independent implementation review PASS disposition, the Phase 2 Closure Record, and implementation regression evidence; R0 remains a carried-forward stage checkpoint and R0.1 remains the semantic Intent boundary."
  current_review: "DTM-Kernel-v0.1-Gate-B-Phase-2-Closure-Record"
  final_architecture_freeze: "NOT_CLAIMED"
  constraints:
    - "Use CapabilityHandle as the only capability authority reference."
    - "Apply strict ExecutionAuthorityScope equality without inferring hierarchy or delegation."
    - "Use the existing authoritative World A ResourceRecordView only through the bounded K2-E local admission/projection bridge; do not claim broader production Resource Admission."
    - "Preserve UNKNOWN as distinct from FAILED and COMPLETED, with no hidden retry."
    - "Do not treat K1 cross-manager consistency OPEN as solved by the local composition lock."
    - "Keep UserIntent, KernelIntentSpec, and KernelIntent distinct; KernelIntent is a future persistent opaque representation and no Intent runtime is implemented in K2-E."
    - "Keep IntentScope distinct from ExecutionAuthorityScope and preserve CapabilityHandle as the only capability authority reference."
    - "Keep Resource execution capacity at Resource level; Phase 1 uses fixed unweighted slots with an effective default of one."
    - "Resolve the bounded Provider seam at Dispatch time after last-mile validation; do not bind Provider identity in an ExecutionAllocation."
    - "Use the exact Resource claim set as the sole authoritative source for Resource execution-capacity claim accounting and available execution capacity."
    - "Treat ExecutionAllocation.CurrentOccupancy as the authoritative current per-allocation occupancy conclusion; keep it distinct from Resource claim accounting and invariant-consistent with the exact claim."
    - "Keep ExecutionOutcome and OccupancyConclusion orthogonal; UNKNOWN does not authorize blind retry or normal release."
    - "Treat Task as a User Space / Policy Layer-managed external concept; RootTaskRef and ChildTaskRef are opaque lineage references only."
    - "Treat ResolutionEvidence as validated transition input, not a Kernel Object, manager, store, lifecycle, or authority by itself."
    - "Keep ExecutionObservation immutable historical evidence separate from the conceptual CurrentOccupancy conclusion on ExecutionAllocation."
    - "Require exact allocation/resource binding and independent Occupancy Resolution Authority; do not infer it from CapabilityHandle or Provider authority."
    - "Capture OwnershipFence as an immutable conceptual allocation snapshot; do not reuse Generation, NodeGeneration, or RegistrationID without proving semantic equivalence."
    - "Limit the bounded Phase 2 resolution runtime to same-fence authority: ResolutionAuthorityFence must exactly equal the immutable OwnershipFence captured by the target ExecutionAllocation."
    - "If an E17 allocation remains UNKNOWN while Resource authority is E18, preserve UNKNOWN and the exact claim HELD when no explicitly authorized same-fence resolution remains; E18 does not grant retrospective authority."
    - "Keep cross-fence resolution, ownership migration/takeover, retrospective authority, and fence-transition runtime RESERVED/DEFERRED for a future milestone."
    - "Keep Phase 2 in-process and deterministic; do not claim persistence, restart recovery, remote resolution, cryptographic proof, or distributed fencing."

