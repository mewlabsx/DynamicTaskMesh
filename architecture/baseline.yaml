    status: "RESERVED"
    layer: "Mesh / authority transfer"
    rule: "Safe role transfer, role lease, and failover require a later design."
  - id: "MultiCore"
    status: "RESERVED"
    layer: "Future Kernel/Mesh topology"
    rule: "Multiple cores and their consistency model are not selected."
  - id: "Gateway"
    status: "RESERVED"
    layer: "Adapter / managed-leaf boundary"
    rule: "Gateway and managed-leaf semantics remain future deployment architecture."
  - id: "AutonomyScopeHierarchy"
    status: "DEFERRED"
    layer: "Future autonomy governance"
    rule: "No hierarchy, inheritance, or cross-Scope delegation is implemented or implied by current equality."
  - id: "RemoteTrust"
    status: "DEFERRED"
    layer: "Future distributed security"
    rule: "Authentication, cryptographic proof, remote Handle meaning, and distributed revocation remain open."
  - id: "CrossManagerConsistency"
    status: "OPEN"
    layer: "Future Kernel operation boundary"
    rule: "TOCTOU, commit-time revalidation, version/epoch, lock ordering, or transaction-like semantics are not selected."
  - id: "CrossFenceResolution"
    status: "RESERVED"
    layer: "Future ownership / recovery / reconciliation"
    rule: "Cross-fence UNKNOWN allocation resolution, retrospective authority, and ownership replacement require a separate design; a newer fence alone does not resolve an older allocation."
  - id: "IntentReconciliation"
    status: "DEFERRED"
    layer: "User Space / future autonomy"
    rule: "User Space intent evaluation/planning/reconciliation and any future admission-boundary coordination remain deferred; the persistent KernelIntent representation does not itself evaluate, reconcile, or build a World Model."

active_architecture_principles:
  - id: "AP-01"
    statement: "Complexity must guard a real safety, correctness, or consistency boundary."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-02"
    statement: "Model the system around Tasks and Resources/Capabilities, not devices."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-03"
    statement: "Resource is an autonomy boundary; Capability is an explicit declaration."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-04"
    statement: "Autonomy should be recursively applicable across local and larger boundaries."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-05"
    statement: "Prefer deterministic convergence over default consensus."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-06"
    statement: "Keep stable identity separate from mutable locator or path."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-07"
    statement: "Prefer local namespaces when global uniqueness is not required."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-08"
    statement: "Every side effect must satisfy an explicit authorization invariant and fail closed when it cannot."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-09"
    statement: "An unknown physical execution result must not be blindly retried."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-10"
    statement: "Prefer append-only, dual-stack, or staged compatibility over replacement."
    source: "AGENTS.md#architecture-principles"
  - id: "AP-11"
    statement: "Keep autonomy, security, managed leaves, adapters, and business logic within explicit boundaries."
    source: "AGENTS.md#architecture-principles"

