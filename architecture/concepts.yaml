state_version: "0.1"

concepts:
  - ConceptID: "Resource"
    owner: "Kernel / ResourceManager"
    layer: "Kernel Object Foundation"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "Provider and autonomy boundary; it is not a Capability or a generic permission and declares capabilities through CapabilityDeclaration. Gate B Phase 1 also owns fixed unweighted execution capacity at this boundary; zero encodes an effective default of one slot."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/resource/model.go"

  - ConceptID: "Capability"
    owner: "MULTIPLE: legacy shared model / Planner matching; no standalone K0.5 Kernel object"
    layer: "MULTIPLE: pre-Kernel domain model and Kernel capability object chain"
    status: "NEEDS_REVIEW"
    semantic_role: "legacy_shared_concept"
    definition: "Historical materials use Capability as a matching or value concept, while the current Kernel model freezes CapabilityDeclaration, CapabilityInstance, and CapabilityHandle as distinct concepts."
    sources:
      - "docs/task-model.md#root-and-child-ownership"
      - "docs/kernel-userspace-boundary.md#ownership"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "CapabilityDeclaration"
    owner: "Kernel / CapabilityManager"
    layer: "Kernel Object Foundation"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "A Resource-attached capability contract that can produce CapabilityInstance state."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/capability/model.go"

  - ConceptID: "CapabilityInstance"
    owner: "Kernel / CapabilityManager"
    layer: "Kernel Object Foundation"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "Provider-backed Kernel state produced from a CapabilityDeclaration; it is not authority by itself."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/capability/model.go"

  - ConceptID: "CapabilityHandle"
    owner: "Kernel / CapabilityManager"
    layer: "Kernel authority boundary"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "The context-bound and ExecutionAuthorityScope-bound authority reference to one CapabilityInstance; its own AvailabilityState is a local handle gate and is not a provider-availability projection; it is the only approved User Space capability authority reference."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/capability/model.go"

  - ConceptID: "Task"
    owner: "User Space / Policy Layer"
    layer: "Application/UserSpace and external execution lineage"
    status: "FROZEN_SEMANTICS_ONLY"
    semantic_role: "external_policy_managed_concept"
    definition: "Task is a Kernel-external managed work-unit concept owned by User Space / Policy Layer. Kernel does not create, decompose, schedule, retry, aggregate results for, complete, or evaluate Tasks or root-task satisfaction; RootTaskRef and ChildTaskRef may be retained only as opaque execution-lineage references."
    lineage_rule: "One Child Task maps to at most one concrete Capability execution request, at most one ExecutionRequest, and at most one Capability invocation. This is an external Task/Policy and execution-lineage contract; it does not make Child Task a Kernel Object."
    kernel_visibility: "Task is not a Kernel Object, Kernel-managed lifecycle, or Kernel scheduler entity. Kernel may retain only opaque RootTaskRef and ChildTaskRef values to state where an execution originated."
    sources:
      - "docs/task-model.md#root-and-child-ownership"
      - "docs/kernel-userspace-boundary.md#ownership"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - ConceptID: "Intent"
    owner: "Historical compatibility umbrella; semantically split into UserIntent and KernelIntent"
    layer: "Cross-boundary vocabulary"
    status: "FROZEN"
    semantic_role: "superseded_umbrella_concept"
    definition: "Unqualified Intent is retained only as a historical and compatibility umbrella. Current architecture distinguishes UserIntent, which remains User Space-owned, from KernelIntentSpec boundary data and KernelIntent, which is a future admitted Kernel-managed persistent intent representation."
    superseded_by:
      - "UserIntent"
      - "KernelIntentSpec"
      - "KernelIntent"
    supersession_scope:
      superseded_aspect: "A single unqualified Intent owner and meaning spanning both application intention and future admitted desired state."
      retained_aspect: "UserIntent remains User Space-owned and outside Kernel authority; the current ObjectKindIntent rejection remains effective."
      effective_state_rule: "The split concepts govern their declared scopes while this umbrella record remains historical compatibility evidence."
    historical_assessment:
      classification: "EXPLICIT_SEMANTIC_SPLIT"
      finding: "Early material proves Task/Application intent and a desired-state/admission question, while K1 freezes the current User Space boundary. R0.1 resolves the unqualified-term collision without claiming an earlier KernelIntent freeze."
      evidence:
        - "Early architecture: docs/kernel-userspace-boundary.md#ownership"
        - "v0.7 conceptual admission: docs/kernel-userspace-boundary.md#effective-state-and-governance"
        - "Current boundary: docs/kernel-userspace-boundary.md#effective-state-and-governance"
        - "R0.1 boundary repair: docs/kernel-userspace-boundary.md#intent-boundary"
    implementation_note: "ObjectKindIntent remains a reserved generic vocabulary marker only; it is rejected by Kernel ObjectReference validation and does not create a current Intent Kernel Object."

  - ConceptID: "UserIntent"
    owner: "Application/UserSpace / Domain / Agent"
    layer: "Application/UserSpace"
    status: "FROZEN_SEMANTICS_ONLY"
    semantic_role: "frozen_boundary_concept"
    definition: "Application, domain, human, or agent-level intention. UserIntent may be ambiguous, natural-language, policy-bearing, or otherwise application-specific; User Space owns Intent Formulation: interpretation, normalization, and translation into KernelIntentSpec. Satisfaction Planning is a separate User Space responsibility for selecting Tasks, capabilities, sequencing, scheduling, reconciliation, and business policy. It is not a Kernel Object or execution authority."
    implementation_note: "Legacy Task.Intent and current application intent remain UserIntent-compatible unless a later explicit decision narrows that mapping."
    sources:
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/task-model.md#root-and-child-ownership"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "KernelIntentSpec"
    owner: "User Space to Kernel Intent Admission Boundary"
    layer: "Boundary input data"
    status: "FROZEN_SEMANTICS_ONLY"
    semantic_role: "admission_boundary_data"
    definition: "A normalized intent or desired-state representation submitted from User Space to the Kernel admission boundary. Its business meaning remains opaque to Kernel. KernelIntentSpec is boundary data, not a Kernel Object, authority reference, plan, Task, or implicit CapabilityHandle."
    open_boundary: "Validation, admission transport, persistence, revision/freshness, and the exact opaque representation remain future mechanisms."
    sources:
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "KernelIntent"
    owner: "Kernel / future Intent Admission Boundary"
    layer: "Future Kernel intent persistence boundary"
    status: "FROZEN_SEMANTICS_ONLY"
    semantic_role: "future_kernel_managed_concept"
    future_object_role: "Prospective persistent Kernel-managed intent record after a later admission/object/lifecycle gate; the current architecture freezes only this semantic role and does not admit a current object reference or ABI."
    definition: "An admitted Kernel-managed persistent representation of an intent created only after the applicable Kernel admission boundary accepts a KernelIntentSpec. Kernel owns stable identity, persistence/lifecycle, revision, ownership/scope, and structural admission/authority semantics while keeping the intent or desired-state payload opaque. KernelIntent does not own business-semantic interpretation, satisfaction evaluation, World Model construction, reconciliation, Satisfaction Planning, scheduling, business policy, Task generation, or capability execution authority."
    minimal_semantics:
      - "Identity"
      - "Lifecycle"
      - "Revision"
      - "Ownership"
      - "IntentScope"
      - "Opaque intent representation"
      - "Structural admission and authority metadata"
    open_boundary: "KernelIntent admission, persistent storage implementation/durability, revision/freshness, syscall exposure, remote meaning, and any external Observation ingress are not implemented or selected. Satisfaction evaluation and reconciliation remain outside this KernelIntent representation boundary."
    implementation_note: "Semantic concept only in the current architecture. ObjectKindIntent represents neither UserIntent nor current KernelIntent; KernelIntent is not added to the current K2 ObjectReference set, does not create an Intent Manager, evaluator, World Model, or reconciliation engine, and does not authorize K2-E local runtime execution."
    sources:
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/task-model.md#root-and-child-ownership"

  - ConceptID: "Observation"
    owner: "Provider/External evidence source; Kernel admission owner is OPEN"
    layer: "Cross-boundary evidence"
    status: "NEEDS_REVIEW"
    semantic_role: "evidence_boundary_concept"
    definition: "Observation or ProviderEvidence is an external/provider report about the physical or external world; it is not authoritative Kernel state and is not an EventRecord by itself."
    open_boundary: "K2-E consumes an already authoritative local ResourceRecordView, but broader provenance, freshness, contradiction, external validation, and the ingress path into a Kernel state transition remain unselected."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/execution-contract.md#results-and-crossing"
      - "docs/execution-contract.md#results-and-crossing"

  - ConceptID: "KernelStateTransition"
    owner: "Kernel object manager / admission boundary"
    layer: "Kernel state mutation boundary"
    status: "FROZEN"
    semantic_role: "state_transition_boundary"
    definition: "An authoritative Kernel state transition is the validated/admitted mutation of a Kernel object's current state; an observation or provider result does not become such a transition without the applicable Kernel admission rule."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "ProviderDeclaration"
    owner: "Provider/Adapter input to Resource admission"
    layer: "Boundary input data"
    status: "DEFERRED"
    semantic_role: "non_kernel_input"
    definition: "A provider declaration is a claim or description supplied to an admission boundary; it is not a Kernel Object and does not establish Resource or Capability authority by itself."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "RegistrationRequest"
    owner: "Provider/Node/Runtime input to Resource admission"
    layer: "Boundary input data"
    status: "DEFERRED"
    semantic_role: "non_kernel_input"
    definition: "A registration request carries a claim for admission; it is not a new Kernel Object, a Resource identity, or proof that the legacy Node/Lease/Endpoint fence has been satisfied."
    sources:
      - "docs/resource-authority.md#reference-profile"
      - "docs/resource-authority.md#reference-profile"

  - ConceptID: "EventRecord"
    owner: "Kernel / EventManager"
    layer: "Kernel audit boundary"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "An immutable Kernel audit fact, not current state; User Space may observe it but may not publish or rewrite it."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/event/model.go"

  - ConceptID: "ExecutionContext"
    owner: "Kernel / ExecutionManager"
    layer: "Kernel execution boundary"
    status: "FROZEN"
    semantic_role: "frozen_kernel_object"
    definition: "The caller execution boundary carrying subject, ExecutionAuthorityScope, lifecycle, and locally lifecycle-derived availability and binding capability authority."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/execution/model.go"

  - ConceptID: "ExecutionRequest"
    owner: "User Space request boundary / Kernel allocation primitive"
    layer: "Kernel execution boundary input"
    status: "BOUNDED_IMPLEMENTED"
    semantic_role: "bounded_boundary_value"
    definition: "A request for one concrete Capability invocation. RootTaskRef and ChildTaskRef are opaque correlation values; the Kernel does not own task lifecycle, priority, ordering, scheduling, planning, or intent satisfaction evaluation."
    sources:
      - "docs/resource-authority.md#execution-capacity"
      - "internal/kernel/execution/ownership.go"

  - ConceptID: "ExecutionDescriptor"
    owner: "Kernel / embedded in ExecutionAllocation"
    layer: "Kernel execution boundary"
    status: "BOUNDED_IMPLEMENTED"
    semantic_role: "embedded_immutable_binding"
    definition: "The canonical execution binding frozen when Resource capacity is granted; it is a value embedded in ExecutionAllocation, not a separately addressable Kernel Object or descriptor store."
    sources:
      - "docs/resource-authority.md#execution-capacity"
      - "internal/kernel/execution/ownership.go"

  - ConceptID: "ExecutionAllocation"
    owner: "Kernel / execution ownership facade"
    layer: "Kernel execution boundary"
    status: "BOUNDED_IMPLEMENTED"
    semantic_role: "bounded_kernel_runtime_object"
    definition: "A Kernel-managed runtime object proving that one concrete execution has been granted Resource capacity. It embeds an immutable ExecutionDescriptor and has only RUNNING and RELEASED lifecycle values."
    supersedes:
      - "K2-B phase-scoped No Invocation Kernel Object limitation, only for Resource execution ownership"
    sources:
      - "docs/resource-authority.md#execution-capacity"
      - "internal/kernel/execution/ownership.go"
      - "internal/kernel/execution_ownership.go"

  - ConceptID: "ExecutionObservation"
    owner: "Kernel bounded Provider dispatch boundary"
    layer: "Kernel execution evidence boundary"
    status: "BOUNDED_IMPLEMENTED"
    semantic_role: "bounded_execution_result_value"
    definition: "An immutable historical observation captured at the Provider boundary. It records what was observed at that interaction through separate ExecutionOutcome and OccupancyConclusion dimensions; it is not Kernel's current authoritative occupancy conclusion, and later resolution cannot rewrite it. UNKNOWN remains explicit and is not a retry or normal-release signal."
    sources:
      - "docs/resource-authority.md#execution-capacity"
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"
      - "internal/kernel/execution/ownership.go"

  - ConceptID: "CurrentOccupancy"
    owner: "Kernel / ExecutionAllocation"
    layer: "Kernel execution ownership state"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    semantic_role: "authoritative_current_state_dimension"
    kernel_object: false
    definition: "Kernel's current authoritative conclusion about whether one existing ExecutionAllocation may still occupy its exact Resource claim. The design-only vocabulary is NOT_ESTABLISHED, UNKNOWN, or ENDED; it is distinct from the historical ExecutionObservation and is not a Resource AvailabilityState or execution outcome."
    values:
      - "NOT_ESTABLISHED: Provider boundary has not been crossed for the allocation."
      - "UNKNOWN: Provider boundary has been crossed and Kernel cannot prove that occupancy has ended; the exact claim remains held."
      - "ENDED: Kernel has authoritative evidence that the allocation can no longer occupy the Resource; the exact claim must not remain held."
    implementation_note: "Bounded implementation adds CurrentOccupancy to the existing ExecutionAllocation and enforces the NOT_ESTABLISHED/UNKNOWN/ENDED transitions; fresh independent implementation review PASS accepted the bounded semantics and the Phase 2 milestone is closed."
    sources:
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - ConceptID: "ResolutionEvidence"
    owner: "Occupancy Resolution Authority / Kernel transition boundary"
    layer: "Kernel execution evidence boundary"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    semantic_role: "validated_state_transition_input"
    kernel_object: false
    definition: "Validated evidence input that may be admitted to the exact ExecutionAllocation state transition when an authorized source proves that current occupancy is ENDED. ResolutionEvidence is not a Kernel Object, object lifecycle, EventRecord, observation rewrite, manager, store, or authority by itself."
    implementation_note: "Bounded implementation validates ResolutionEvidence as transition input through the exact resolution request; no ResolutionEvidenceManager, ResolutionEvidenceStore, ObjectKind, persistence, or evidence lifecycle is introduced."
    sources:
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - ConceptID: "OccupancyResolutionAuthority"
    owner: "Resource execution-ownership authority"
    layer: "Kernel execution authority boundary"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    semantic_role: "separate_authority_role"
    kernel_object: false
    definition: "The authority role that may authoritatively prove that one exact execution allocation can no longer occupy its Resource. In the bounded Phase 2 runtime, its ResolutionAuthorityFence must exactly match the immutable OwnershipFence captured by the target allocation. It is distinct from the caller's Execution Authority and the Provider's authority to perform a Capability operation; a CapabilityHandle or Provider relationship does not grant it implicitly."
    sources:
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - ConceptID: "OwnershipFence"
    owner: "Resource execution-ownership authority"
    layer: "Kernel execution ownership boundary"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    semantic_role: "immutable_allocation_fence_snapshot"
    kernel_object: false
    definition: "The Resource execution-ownership authority value captured immutably by an ExecutionAllocation when its exact claim is granted. Bounded Phase 2 resolution is same-fence only: ResolutionAuthorityFence must exactly match this snapshot. A newer ownership fence invalidates stale resolution authority, grants no retrospective authority over an older UNKNOWN allocation, and fence advancement alone is not proof that the older execution has ended."
    implementation_note: "Bounded implementation stores a dedicated Resource-issued OwnershipFence snapshot on each allocation and checks same-fence resolution; no fence protocol, ownership migration, cross-fence resolution, or persistence is implemented."
    sources:
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"
      - "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - ConceptID: "State"
    owner: "UNCONFIRMED: multiple object managers and legacy Task/Execution models"
    layer: "Cross-cutting semantic vocabulary"
    status: "NEEDS_REVIEW"
    semantic_role: "overloaded_vocabulary"
    definition: "The generic term State is overloaded: current Kernel material separates LifecycleState and AvailabilityState, while EvaluationState is User Space/future evaluation vocabulary whose package aliases do not establish KernelIntent ownership or a required Kernel lifecycle dimension."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/identity/semantics.go"
      - "docs/task-model.md#root-and-child-ownership"

  - ConceptID: "Memory"
    owner: "UNCONFIRMED"
    layer: "UNCONFIRMED"
    status: "NEEDS_REVIEW"
    semantic_role: "unconfirmed_concept"
    definition: "No current K0.5/K1 architecture definition or Kernel object for Memory was identified in the reviewed material."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "Context"
    owner: "MULTIPLE: ExecutionContext is Kernel-owned; generic Context usage remains in legacy Runtime"
    layer: "MULTIPLE: Kernel execution boundary and Runtime cancellation boundary"
    status: "NEEDS_REVIEW"
    semantic_role: "overloaded_term"
    definition: "ExecutionContext is a frozen Kernel concept, but the generic term Context also names legacy runtime cancellation and deadline propagation; no single broader Context ownership is frozen."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#ownership"
      - "internal/kernel/execution/model.go"

  - ConceptID: "Membership"
    owner: "UNCONFIRMED"
    layer: "UNCONFIRMED"
    status: "NEEDS_REVIEW"
    semantic_role: "unconfirmed_concept"
    definition: "Autonomous-kernel materials discuss Runtime participation and membership questions, but the K0.5 object model defines no Membership object or frozen owner."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "ExecutionAuthorityScope"
    owner: "Kernel / ExecutionManager and CapabilityManager"
    layer: "Kernel authority boundary"
    status: "FROZEN"
    semantic_role: "frozen_boundary_concept"
    definition: "The current K1 Handle/Context authority domain; the existing Scope fields are interpreted in this domain and require strict equality."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "internal/kernel/execution/model.go"

  - ConceptID: "AutonomyScope"
    owner: "UNCONFIRMED: future autonomy governance"
    layer: "Future autonomy architecture"
    status: "RESERVED"
    semantic_role: "reserved_future_concept"
    definition: "A future boundary for autonomous participation or reconciliation; it is not mapped to ExecutionContext.Scope or CapabilityHandle.Scope."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - ConceptID: "IntentScope"
    owner: "UserIntent / future KernelIntent boundary"
    layer: "Intent boundary"
    status: "RESERVED"
    semantic_role: "reserved_future_concept"
    definition: "The scope of an application intent or future Kernel-managed persistent intent representation. IntentScope is distinct from ExecutionAuthorityScope; it does not grant execution authority and is not compared with a CapabilityHandle or ExecutionContext Scope."
    open_boundary: "IntentScope hierarchy, inheritance, containment, delegation, and cross-domain authorization remain RESERVED/DEFERRED."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#intent-boundary"
      - "docs/kernel-userspace-boundary.md#intent-boundary"

  - ConceptID: "RoleScope"
    owner: "UNCONFIRMED: future Mesh/governance layer"
    layer: "Future Mesh/governance"
    status: "RESERVED"
    semantic_role: "reserved_future_concept"
    definition: "A future role eligibility or governance boundary; role selection does not grant or widen a CapabilityHandle authority Scope."
    sources:
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/resource-authority.md#reference-profile"

  - ConceptID: "AutonomousLoop"
    owner: "UNCONFIRMED: future DTM autonomy layer"
    layer: "Future UserSpace/Mesh/Kernel integration"
    status: "RESERVED"
    semantic_role: "reserved_success_criterion"
    definition: "The broader observe, evaluate, choose, invoke, change, and re-observe closed loop that gives DTM autonomous-kernel value; it is not implemented by the current K2-E local runtime foundation."
    sources:
