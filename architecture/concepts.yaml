      - "docs/task-model.md#root-and-child-ownership"

  - ConceptID: "Runtime"
    owner: "MULTIPLE: legacy DTM Runtime and future Kernel Runtime boundary"
    layer: "MULTIPLE: legacy Runtime and Kernel interface boundary"
    status: "NEEDS_REVIEW"
    semantic_role: "overloaded_term"
    risk:
      - "concept_collision"
    definition: "Legacy Runtime executes mapped plans; K1 materials use Kernel Runtime as a semantic boundary whose runtime is not implemented. Different contexts do not necessarily denote one concept."
    sources:
      - "docs/kernel-userspace-boundary.md#ownership"
      - "docs/kernel-userspace-boundary.md#effective-state-and-governance"
      - "docs/kernel-userspace-boundary.md#ownership"
