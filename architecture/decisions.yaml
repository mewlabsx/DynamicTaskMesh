    status: "DEFERRED"
    supersedes: []
    decision: "EventRecord persistence, query retention, recovery semantics, WAL, and Event Journal behavior are not defined."
    rationale: "The current EventRecord state is an in-memory immutable audit fact; durability is outside R1."
    source:
