state_version: "0.1"

invariants:
  - id: "INV-KERNEL-USERSPACE-BOUNDARY"
    name: "Kernel/UserSpace boundary"
    rule: "The Kernel/UserSpace boundary is semantic; internal Kernel APIs are not automatically a User Space ABI, and the frozen K1 semantic contract remains distinct from any wire, transport, or language ABI."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-INTENT-USERSPACE"
    name: "Intent stays outside Kernel authority"
    rule: "Intent must not become a Kernel authority, syscall target, implicit CapabilityHandle, or Kernel-side workflow decision; the reserved ObjectKindIntent marker is not a valid Kernel ObjectReference."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-TASK-EXTERNAL-POLICY-MANAGED"
    name: "Task is external and policy-managed"
    rule: "Task is owned by User Space / Policy Layer and is not a Kernel Object, Kernel-managed lifecycle, or Kernel scheduler entity. Kernel does not create, decompose, schedule, retry, aggregate, complete, or evaluate Tasks; RootTaskRef and ChildTaskRef are opaque lineage references only. One Child Task maps to at most one concrete Capability execution request, at most one ExecutionRequest, and at most one Capability invocation under the external Task/Policy contract."
    severity: "CRITICAL"
    status: "FROZEN_SEMANTICS_ONLY"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-R0.1-INTENT-LAYER-SEPARATION"
    name: "UserIntent and KernelIntent are not the same semantic object"
    rule: "UserIntent belongs to User Space and may be interpreted or normalized there; KernelIntent is a distinct future admitted Kernel-managed persistent intent representation. KernelIntentSpec remains boundary data rather than a Kernel Object, and neither layer may silently substitute for the other."
    severity: "CRITICAL"
    status: "FROZEN_SEMANTICS_ONLY"
    supersession_mode: "PARTIAL"
    supersedes:
      - "INV-INTENT-USERSPACE"
    supersession_scope:
      superseded_aspect: "The unqualified Intent term as one complete User Space-only semantic object."
      retained_aspect: "UserIntent remains outside Kernel authority, and ObjectKindIntent remains invalid as a current Kernel ObjectReference."
    effective_state_rule: "The later invariant governs the declared split while the retained aspects of the superseded invariant remain effective; the older record remains historical compatibility evidence."
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-R0.1-KERNELINTENT-NOT-EXECUTION-AUTHORITY"
    name: "KernelIntent does not grant authority or own Task generation"
    rule: "KernelIntent is a persistent intent representation with opaque business semantics; it is not a CapabilityHandle, CapabilityInstance, Resource, ExecutionContext, authorization proof, Task owner, Planner, Scheduler, evaluator, World Model, business-policy engine, or implicit execution request. Capability authority still requires a valid CapabilityHandle."
    severity: "CRITICAL"
    status: "FROZEN_SEMANTICS_ONLY"
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-R0.1-EVALUATION-REQUIRES-OBSERVATION"
    name: "Intent evaluation remains outside the KernelIntent representation"
    rule: "When User Space or a later explicitly admitted evaluation boundary evaluates an intent, SATISFIED or UNSATISFIED requires applicable validated Observation or another deterministic mechanism; UNKNOWN remains valid until evidence exists. This evaluation is not a required KernelIntent lifecycle dimension, and unverified probabilistic or Kernel-side LLM reasoning cannot establish authoritative state."
    severity: "CRITICAL"
    status: "FROZEN_SEMANTICS_ONLY"
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-R0.1-KERNELINTENT-PERSISTENT-OPAQUE"
    name: "KernelIntent is a persistent opaque representation"
    rule: "A future admitted KernelIntent is a persistent Kernel-managed representation of an intent. Kernel owns stable identity, persistence/lifecycle, revision, ownership/scope, and structural admission/authority semantics; its intent or desired-state payload remains opaque to Kernel business logic. Kernel does not perceive, interpret, evaluate satisfaction, reconcile, build a World Model, generate Tasks, or grant capability authority."
    severity: "CRITICAL"
    status: "FROZEN_SEMANTICS_ONLY"
    supersession_mode: "PARTIAL"
    partially_supersedes:
      - id: "INV-R0.1-INTENT-LAYER-SEPARATION"
        scope: "KernelIntent ownership of business Desired State semantics and evaluation"
        retained_aspect: "UserIntent, KernelIntentSpec, and future KernelIntent remain distinct layers; current ObjectKindIntent rejection remains effective."
      - id: "INV-R0.1-KERNELINTENT-NOT-EXECUTION-AUTHORITY"
        scope: "KernelIntent wording that treats it as a Kernel-owned Desired State mechanism"
        retained_aspect: "KernelIntent grants no capability authority and does not own Task generation, planning, scheduling, or business policy."
      - id: "INV-R0.1-EVALUATION-REQUIRES-OBSERVATION"
        scope: "KernelIntent as the owner of an EvaluationState lifecycle dimension"
        retained_aspect: "Any future intent evaluation must preserve applicable evidence, deterministic semantics, and UNKNOWN; the current KernelIntent representation does not perform it."
    effective_state_rule: "This later invariant governs the KernelIntent ownership/evaluation scope. The retained aspects of the partially superseded invariants remain effective, and their older wording remains compatibility evidence rather than a competing current meaning."
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-RESOURCE-CAPABILITY-SEPARATION"
    name: "Resource and Capability are distinct"
    rule: "Resource is not Capability; a Resource declares capabilities through CapabilityDeclaration."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-CAPABILITY-AUTHORITY"
    name: "Capability authority requires a Handle"
    rule: "CapabilityInstance and Resource IDs are not authority; capability use requires a valid CapabilityHandle."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-HANDLE-CONTEXT-SCOPE"
    name: "Handle binding and Scope equality"
    rule: "A CapabilityHandle is bound to one ExecutionContext and its current Scope field is an ExecutionAuthorityScope that must equal the context Scope; mismatch fails closed without implying equality in other Scope domains."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-LIFECYCLE-AVAILABILITY-SEPARATION"
    name: "Lifecycle and availability are separate"
    rule: "LifecycleState and AvailabilityState are distinct; UNAVAILABLE belongs only to AvailabilityState."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-EVENT-IMMUTABLE-SEMANTIC"
    name: "EventRecord is immutable audit fact"
    rule: "EventRecord is an immutable Kernel fact, not current state; User Space or a provider observation cannot publish or rewrite it through the Kernel boundary."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-QUERY-PURE-SNAPSHOT"
    name: "Kernel query is pure and snapshot-based"
    rule: "A read-only query of Kernel objects must not mutate state, revoke objects, emit lifecycle events, or expose mutable internal state; this query semantics is distinct from external Observation evidence."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-AUDIT-ROLLBACK"
    name: "Mandatory audit is rollback-coupled"
    rule: "A state mutation requiring an audit fact is not committed when mandatory audit publication fails; the operation is not accepted after such failure."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-FAIL-CLOSED-AUTHORITY"
    name: "Invalid authority fails closed"
    rule: "Invalid, revoked, expired, or destroyed Handles fail closed; side-effecting execution requires execution-side revalidation and required security evidence."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-UNKNOWN-NO-BLIND-RETRY"
    name: "Unknown execution result is not a retry signal"
    rule: "An execution result that may already have produced a physical side effect must not be blindly retried."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "AGENTS.md#architecture-principles"

  - id: "INV-RESOURCE-LIFECYCLE-SUBSET"
    name: "Resource lifecycle is a strict subset"
    rule: "Resource accepts CREATED, ACTIVE, SUSPENDED, and REMOVED; Resource does not accept TERMINATED as its lifecycle state."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-OBSERVATION-EVIDENCE-SEPARATION"
    name: "Observation is not authoritative state or EventRecord"
    rule: "Physical/external Observation or ProviderEvidence is untrusted or bounded evidence until the applicable admission/validation boundary accepts it; it is not an authoritative Kernel state transition or immutable EventRecord by itself."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-RESOURCE-ADMISSION-BEFORE-AUTHORITY"
    name: "Resource authority requires admission"
    rule: "A provider declaration, registration request, Mesh advertisement, Resource ID, or local test constructor does not by itself establish authoritative Resource or Capability authority. K2-E may project only an already authoritative ResourceRecordView whose Node/Lease/Endpoint/registration_id/generation fence and eligibility evidence pass the local bridge; the projection still does not grant caller authority, and the broader admission bridge remains open."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"
    implementation_evidence: "docs/status.md#recorded-status"

  - id: "INV-SCOPE-DOMAIN-SEPARATION"
    name: "Scope domains are not implicitly interchangeable"
    rule: "ExecutionAuthorityScope is the only current Handle/Context Scope domain; AutonomyScope, IntentScope, RoleScope, and Mesh/Region scope meanings remain separate and do not imply containment, inheritance, equality, or delegation."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-LOCAL-AVAILABILITY-PROVENANCE"
    name: "Local Context and Handle availability provenance"
    rule: "In the current Kernel model, ExecutionContext.Availability and CapabilityHandle.Availability are local lifecycle-derived usability gates; Resource/CapabilityInstance provider availability is checked separately and must not project into or silently rewrite those lifecycle states."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"

  - id: "INV-GATE-A-IS-NOT-GATE-B"
    name: "Runtime foundation is not autonomous-loop completion"
    rule: "K2-E evidence and the bounded Gate B Phase 1 Resource execution-ownership path must not be reported as completion of the broader autonomous observe/evaluate/invoke/re-observe loop."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#effective-state-and-governance"
    implementation_evidence: "docs/resource-authority.md#execution-capacity"

  - id: "INV-ALLOCATION-IS-NOT-AUTHORITY"
    name: "Authorization and allocation remain distinct"
    rule: "A valid CapabilityHandle and K2 authority validation do not create an ExecutionAllocation; Resource capacity is consumed only by the later TryAllocateExecution step."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/resource-authority.md#execution-capacity"

  - id: "INV-RESOURCE-OWNS-EXECUTION-CAPACITY"
    name: "Execution capacity is owned by Resource"
    rule: "Resource owns execution capacity. With fixed unweighted slots and an effective default capacity of one, the live exact allocation-claim set is the sole authoritative source for Resource execution-capacity claim accounting and available execution capacity. ExecutionAllocation.CurrentOccupancy remains a separate authoritative per-allocation occupancy conclusion, does not own Resource capacity, and the exact claim set cannot by itself distinguish NOT_ESTABLISHED from UNKNOWN. CapabilityInstance-level capacity cannot bypass Resource exclusivity."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/resource-authority.md#execution-capacity"

  - id: "INV-ALLOCATION-DISPATCH-BARRIER"
    name: "Provider dispatch requires a running allocation"
    rule: "No valid RUNNING ExecutionAllocation means zero Gate B Provider calls; one allocation can claim the normal Provider dispatch boundary at most once, and the bounded Provider seam is resolved only at dispatch time after last-mile validation."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/resource-authority.md#execution-capacity"

  - id: "INV-ALLOCATION-PROVIDER-DISPATCH-RESOLUTION"
    name: "Provider resolution is a dispatch-time responsibility"
    rule: "ExecutionAllocation freezes the execution binding but not Provider identity. TryAllocateExecution never captures a Provider; DispatchExecution snapshots the currently configured bounded Provider seam after allocation, authority, Resource, and operation validation and before the Provider method boundary."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-RESOURCE-CLAIM-SET-SOLE-OCCUPANCY-SOURCE"
    name: "Resource capacity claim accounting has one source of truth"
    rule: "Resource execution-capacity consumption and available execution capacity are derived from the live exact allocation-claim set under the Resource manager lock; the claim set is authoritative for Resource capacity accounting. ExecutionAllocation.CurrentOccupancy remains authoritative for the current occupancy conclusion of one exact allocation; these are distinct facts linked by invariants, and no parallel mutable capacity counter may diverge from the claims."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-RESOURCE-CLAIM-PRIMITIVES-ARE-INTERNAL"
    name: "Resource claim methods are internal coordination primitives"
    rule: "Resource.TryAcquireExecution and Resource.ReleaseExecution are low-level Kernel coordination primitives, not a User Space ABI; normal execution paths must use the Kernel allocation/release facade so capacity claims remain coupled to an ExecutionAllocation record."
    severity: "HIGH"
    status: "FROZEN"
    source: "docs/kernel-userspace-boundary.md#intent-boundary"

  - id: "INV-OBSERVATION-OUTCOME-OCCUPANCY-SEPARATION"
    name: "Outcome and occupancy certainty are orthogonal"
    rule: "ExecutionOutcome and OccupancyConclusion are separate dimensions; UNKNOWN remains explicit and is never converted to FAILED or an implicit retry signal."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/resource-authority.md#execution-capacity"

  - id: "INV-UNKNOWN-OCCUPANCY-NO-RELEASE"
    name: "Unknown occupancy cannot release capacity"
    rule: "A completed dispatch with OccupancyConclusion UNKNOWN cannot be normally released; the allocation remains RUNNING and its Resource slot remains occupied pending a later authoritative occupancy resolution. No reconciliation engine is implied by this rule."
    severity: "CRITICAL"
    status: "FROZEN"
    source: "docs/resource-authority.md#execution-capacity"

  - id: "INV-RESOLUTION-EVIDENCE-NOT-KERNEL-OBJECT"
    name: "Resolution Evidence is transition input, not a Kernel Object"
    rule: "Resolution Evidence is validated state-transition input only. It does not have Kernel Object identity, lifecycle, manager, store, or authority by itself; an accepted resolution may mutate authoritative execution state and is then represented by an immutable EventRecord."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-EXECUTION-OBSERVATION-IMMUTABLE"
    name: "ExecutionObservation remains immutable history"
    rule: "ExecutionObservation records what was observed at dispatch/provider interaction and is immutable historical evidence. Later occupancy resolution may update the authoritative ExecutionAllocation conclusion but must not rewrite the original ExecutionObservation."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-CURRENT-OCCUPANCY-AUTHORITY"
    name: "CurrentOccupancy is the allocation's authoritative conclusion"
    rule: "ExecutionAllocation.CurrentOccupancy is Kernel's current authoritative conclusion about whether that exact allocation may still occupy its Resource. It uses only NOT_ESTABLISHED, UNKNOWN, and ENDED and remains distinct from historical observation, execution outcome, lifecycle, and Resource AvailabilityState."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-UNKNOWN-OCCUPANCY-RETAINS-CLAIM"
    name: "Unknown current occupancy retains the exact claim"
    rule: "CurrentOccupancy == UNKNOWN implies that the Provider boundary was crossed without proof of termination and the exact Resource claim for the ExecutionAllocation remains held. UNKNOWN is not not-started, not-dispatched, failed, or timed out."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-ENDED-OCCUPANCY-RELEASES-CLAIM"
    name: "Ended current occupancy releases the exact claim"
    rule: "CurrentOccupancy == ENDED implies that the exact Resource claim for the allocation is absent and the allocation Lifecycle is RELEASED. The invalid intermediate state ENDED with a held exact claim must not be externally observable."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RELEASED-IMPLIES-ENDED"
    name: "Released execution implies ended occupancy"
    rule: "ExecutionAllocation Lifecycle == RELEASED implies CurrentOccupancy == ENDED and the exact Resource claim is NONE. A released allocation cannot retain UNKNOWN occupancy."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-AUTHORITY-SEPARATION"
    name: "Execution, Provider, and resolution authorities are separate"
    rule: "Execution Authority, Provider Authority, and Occupancy Resolution Authority are independent roles. CapabilityHandle grants execution authority only within its existing boundary and does not grant occupancy-resolution authority; Provider execution does not grant resolution authority unless its explicit contract says so."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-EXACT-ALLOCATION-BINDING"
    name: "Resolution is exact-allocation scoped"
    rule: "A resolution must bind to the exact ExecutionAllocationID, its ResourceID, and the applicable Resource execution-ownership authority/fence. Phase 2 does not admit an unqualified or bulk statement that all old executions on a Resource have ended."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-FENCE-AUTHORITY"
    name: "Resolution requires compatible ownership-fence authority"
    rule: "ExecutionAllocation captures an immutable snapshot of the Resource execution-ownership fence at claim grant. Stale or incompatible resolution authority fails closed; a newer ownership fence invalidates stale resolution authority."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-SAME-FENCE-ONLY"
    name: "Initial occupancy resolution is same-fence only"
    rule: "For the bounded Gate B Phase 2 runtime, an Occupancy Resolution Authority may resolve an unresolved ExecutionAllocation only when its execution-ownership authority/fence exactly matches the immutable OwnershipFence captured by that allocation."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-CROSS-FENCE-UNKNOWN-FAIL-CLOSED"
    name: "Cross-fence UNKNOWN allocation remains unresolved"
    rule: "When an allocation captured at E17 remains UNKNOWN while Resource authority is E18, E18 alone grants no retrospective resolution authority and does not prove termination. If no authorized same-fence resolution remains, preserve CurrentOccupancy UNKNOWN and the exact claim HELD and fail closed; cross-fence resolution remains RESERVED for a future ownership, recovery, or reconciliation milestone."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-OWNERSHIP-FENCE-NOT-TERMINATION-PROOF"
    name: "Fence advancement is not termination proof"
    rule: "OwnershipFence advancement alone does not prove that an older execution has ended. It can serve as termination evidence only when a future explicitly designed ownership-transition mechanism guarantees that older executions can no longer occupy or affect the Resource."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-ATOMIC-RELEASE"
    name: "Resolution and exact-claim release are atomic"
    rule: "Accepted authoritative resolution, exact Resource claim removal, CurrentOccupancy ENDED, ExecutionAllocation Lifecycle RELEASED, and the resulting immutable EventRecord belong to one Kernel consistency boundary. Contradictory ownership state fails closed and is not silently repaired as a successful resolution."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-IDEMPOTENT"
    name: "Accepted resolution is idempotent"
    rule: "Repeating an equivalent resolution returns an already-resolved/no-transition result only when the immutable original ExecutionObservation exists with Occupancy UNKNOWN, the allocation is RELEASED with CurrentOccupancy ENDED, and the exact Resource claim is NONE. Pre-dispatch or immediate definitive ENDED terminal state alone is not resolution history; an unexpected terminal claim fails closed rather than being repaired."
    severity: "HIGH"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-RESOLUTION-RESOURCE-AVAILABILITY-SEPARATION"
    name: "Execution release does not imply Resource availability"
    rule: "Execution occupancy and Resource AvailabilityState remain separate. Releasing an execution claim does not make an unavailable Resource available, and a stale execution claim must not be retained merely to express Resource unavailability."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-PHASE-2-IN-PROCESS-ONLY"
    name: "Phase 2 ownership state is not a persistence contract"
    rule: "CurrentOccupancy and OwnershipFence are in-process deterministic bounded implementation state only. Phase 2 does not claim crash recovery, restart reconstruction, durable exact claims, durable fences, or physical execution reconciliation."
    severity: "HIGH"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-CANCELLATION-IS-NOT-ENDED"
    name: "Cancellation is not execution termination evidence"
    rule: "A cancellation or termination-control request is not proof that an execution ended and cannot by itself transition CurrentOccupancy to ENDED or release the exact Resource claim."
    severity: "CRITICAL"
    status: "ACCEPTED"
    design_status: "ACCEPTED"
    review_status: "PASS"
    implementation_status: "BOUNDED_IMPLEMENTED"
    implementation_readiness: "CLOSED"
    implementation_review_status: "PASS"
    source: "docs/execution-contract.md#ownership-and-same-fence-resolution"

  - id: "INV-DEFERRED-NOT-NEGATED"
    name: "Milestone deferral is not architectural removal"
